[tool.poetry]
name = "mysite"
version = "0.1.0"
description = "Django-приложение (shopapp, blogapp, myauth) для практической работы по публикации проекта"
authors = ["Daria Tyurina"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
Django = "4.2"
django-debug-toolbar = "4.0.0"
django-filter = "22.1"
djangorestframework = "3.14.0"
Pillow = "9.4.0"
asgiref = "3.6.0"
pytz = "2022.7.1"
sqlparse = "0.4.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
